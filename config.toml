# Configuration guide: https://github.com/nvbangg/builder-for-morphe/blob/main/CONTRIBUTING.md

strict-sigcheck = false

[YouTube]
enabled = true
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"

[YouTube.patches]
"github:MorpheApp/morphe-patches" = []

[YT-Music]
enabled = true
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
arch = "both"

[YT-Music.patches]
"github:MorpheApp/morphe-patches" = []

[Reddit]
enabled = true
apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit"

[Reddit.patches]
"github:MorpheApp/morphe-patches" = []

[YouTube-Experimental]
enabled = false
brand = "morphe-dev"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
version = "exp"
patcher-args = "-e 'Change header' -Ocustom=icons/YouTube/header -e 'Custom branding' -OcustomIcon=icons/YouTube/branding -OcustomName='YouTube Morphe'"

[YouTube-Experimental.patches]
"github:MorpheApp/morphe-patches" = { version = "dev" }

[YT-Music-Experimental]
enabled = false
brand = "morphe-dev"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
arch = "both"
version = "exp"
patcher-args = "-e 'Change header' -Ocustom=icons/Music/header -e 'Custom branding' -OcustomIcon=icons/Music/branding -OcustomName='Music Morphe'"

[YT-Music-Experimental.patches]
"github:MorpheApp/morphe-patches" = { version = "dev" }

[Reddit-Experimental]
enabled = false
brand = "morphe-dev"
apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit"
version = "exp"
patcher-args = "-e 'Custom branding name for Reddit' -OappName='Reddit Morphe'"

[Reddit-Experimental.patches]
"github:MorpheApp/morphe-patches" = { version = "dev" }

[X-Twitter]
enabled = true
brand = "piko"
apkmirror-dlurl = "https://www.apkmirror.com/apk/x-corp/twitter"

[X-Twitter.patches]
"github:crimera/piko" = ["Browse tweet object", "Dynamic color"]

[Instagram]
enabled = true
brand = "piko"
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"
arch = "arm64-v8a"
patcher-args = "-e 'Theme' -Oamoled=true"

[Instagram.patches]
"github:crimera/piko" = []

[Messenger.patches]
"github:rushiranpise/morphe-patches" = []

[Telegram]
enabled = false
brand = "rushi"
apkmirror-dlurl = "https://www.apkmirror.com/apk/telegram-fz-llc/telegram-web-version/"
changelog-keywords = ["Telegram"]

[Telegram.patches]
"github:rushiranpise/morphe-patches" = []

[Proton-VPN]
enabled = false
brand = "rushi"
apkmirror-dlurl = "https://www.apkmirror.com/apk/proton-technologies-ag/protonvpn-secure-and-free-vpn/"
changelog-keywords = ["Proton"]

[Proton-VPN.patches]
"github:rushiranpise/morphe-patches" = []

[Duolingo]
enabled = false
brand = "hoo-dles"
apkmirror-dlurl = "https://www.apkmirror.com/apk/duolingo/duolingo-duolingo/"
changelog-keywords = ["Duolingo"]

[Duolingo.patches]
"github:hoo-dles/morphe-patches" = []

[Twitch]
enabled = false
brand = "hooman"
apkmirror-dlurl = "https://www.apkmirror.com/apk/twitch-interactive-inc/twitch/"
changelog-keywords = ["Twitch"]

[Twitch.patches]
"github:arandomhooman/hoomans-morphe-patches" = []

[Truecaller]
enabled = false
brand = "paresh"
apkmirror-dlurl = "https://www.apkmirror.com/apk/true-software-scandinavia-ab/truecaller-caller-id-block/"
changelog-keywords = ["Truecaller"]

[TikTok]
enabled = false
brand = "tiktok"
apkmirror-dlurl = "https://www.apkmirror.com/apk/tiktok-pte-ltd/tik-tok-including-musical-ly/"

[TikTok.patches]
"github:icysymmetra/tiktok-patches-for-morphe" = []
